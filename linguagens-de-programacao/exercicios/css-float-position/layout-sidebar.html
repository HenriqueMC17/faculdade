<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com Sidebar e Conteúdo Principal</title>
    <style>
        /* Reset básico para evitar barras de rolagem indesejadas */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Container para limpar os floats se necessário */
        .wrapper {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Garante que o container envolva os elementos flutuantes */
        }

        /* Regra 2 e 4: Barra Lateral */
        .sidebar {
            /* Regra 4: Flutuar à esquerda */
            float: left;
            /* Regra 2: Largura de 20% e Altura de 100vh */
            width: 20%;
            height: 100vh;
            background-color: #3498db; /* Cor de fundo diferente (Azul) */
            padding: 20px;
            color: white;
            /* Regra 5: Uso da propriedade position */
            position: relative; 
        }

        .sidebar h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .sidebar nav ul {
            list-style: none;
        }

        .sidebar nav ul li {
            margin-bottom: 10px;
        }

        .sidebar nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .sidebar nav ul li a:hover {
            text-decoration: underline;
        }

        /* Regra 3 e 4: Conteúdo Principal */
        .main-content {
            /* Regra 4: Flutuar à direita */
            float: right;
            /* Regra 3: Largura de 80% e Altura de 100vh */
            width: 80%;
            height: 100vh;
            background-color: #ecf0f1; /* Cor de fundo diferente (Cinza claro) */
            /* Regra 5: Uso da propriedade position */
            position: relative;
            
            /* Regra 3 (Alinhamento): Centro vertical e horizontal */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .main-content h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .main-content p {
            color: #7f8c8d;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Barra Lateral -->
        <div class="sidebar">
            <nav>
                <ul>
                    <li><a href="#">Página Inicial</a></li>
                    <li><a href="#">Sobre</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </nav>
        </div>

        <!-- Conteúdo Principal -->
        <div class="main-content">
            <h1>Seja bem-vindo ao nosso site</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nullam at nisi vel nisi tincidunt vehicula.</p>
        </div>
    </div>
</body>
</html>
