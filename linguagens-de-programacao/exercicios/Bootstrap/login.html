<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chef Academy | Cursos Culinários Gratuitos</title>
  <!-- Bootstrap 5.2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-card">
      <form id="loginForm" class="form-signin needs-validation" novalidate>
        <div class="text-center mb-4">
          <!-- Premium Culinary Logo Icon -->
          <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle p-3 shadow-sm mb-3">
            <i class="bi bi-egg-fried text-warning" style="font-size: 2.5rem; line-height: 1;"></i>
          </div>
          <h1 class="h3 mb-1 fw-bold text-dark">Chef Academy</h1>
          <p class="text-muted small">Aprenda com os melhores mestres cucas</p>
        </div>

        <div class="form-floating mb-3">
          <input type="email" class="form-control rounded-3" id="floatingInput" placeholder="nome@exemplo.com" required>
          <label for="floatingInput">Endereço de E-mail</label>
          <div class="invalid-feedback">
            Por favor, insira um e-mail válido.
          </div>
        </div>
        
        <div class="form-floating mb-3">
          <input type="password" class="form-control rounded-3" id="floatingPassword" placeholder="Senha" required minlength="4">
          <label for="floatingPassword">Senha</label>
          <div class="invalid-feedback">
            A senha deve conter no mínimo 4 caracteres.
          </div>
        </div>

        <div class="checkbox mb-3 d-flex justify-content-between align-items-center">
          <label class="text-secondary small cursor-pointer">
            <input type="checkbox" value="remember-me" class="form-check-input me-1"> Lembrar-me
          </label>
          <a href="#" class="text-decoration-none small text-warning fw-semibold">Esqueceu a senha?</a>
        </div>

        <button class="w-100 btn btn-lg btn-primary-culinary shadow-sm" type="submit">
          Entrar <i class="bi bi-box-arrow-in-right ms-1"></i>
        </button>

        <div class="text-center mt-4">
          <p class="text-secondary small mb-0">Não tem uma conta? <a href="#" class="text-warning fw-semibold text-decoration-none">Cadastre-se</a></p>
        </div>

        <p class="mt-4 mb-0 text-center text-muted small">&copy; 2026 Chef Academy</p>
      </form>
    </div>
  </div>

  <!-- Bootstrap Bundle JS with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Form Validation & Redirect Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('loginForm');

      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
          form.classList.add('was-validated');
        } else {
          event.preventDefault();
          // Simula login de sucesso salvando no localStorage
          const email = document.getElementById('floatingInput').value;
          localStorage.setItem('userLoggedIn', 'true');
          localStorage.setItem('userEmail', email);
          
          // Redireciona para a home
          window.location.href = 'index.html';
        }
      }, false);
    });
  </script>
</body>
</html>
